<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Faceted crystal in the spirit of the Crystal language logo -->
  <g stroke="#1a1a1a" stroke-width="1" stroke-linejoin="round">
    <!-- crown -->
    <polygon points="18,8 6,24 22,24" fill="#d9d9d9"/>
    <polygon points="18,8 22,24 42,24 46,8" fill="#f5f5f5"/>
    <polygon points="46,8 42,24 58,24" fill="#a6a6a6"/>
    <!-- pavilion -->
    <polygon points="6,24 22,24 32,56" fill="#737373"/>
    <polygon points="22,24 42,24 32,56" fill="#404040"/>
    <polygon points="42,24 58,24 32,56" fill="#595959"/>
  </g>
</svg>
