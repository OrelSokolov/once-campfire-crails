# 1:1-парити артефактов capybara-харнесса из корня проекта:
#   bundle exec twinshot generate oracle   # rails-прогон (артефакты capybara-tests/artifacts/rails)
#   bundle exec twinshot generate current  # crails-прогон (артефакты capybara-tests/artifacts/crails)
#   bundle exec twinshot compare
# Запуск из capybara-tests: cd capybara-tests && bundle exec twinshot ...
oracle:
  path: capybara-tests/artifacts/rails
  generate: cd capybara-tests && PARITY_RUBY=$HOME/.rvm/rubies/ruby-3.4.5/bin/ruby TARGET=rails bin/run

current:
  path: capybara-tests/artifacts/crails
  generate: cd capybara-tests && PARITY_RUBY=$HOME/.rvm/rubies/ruby-3.4.5/bin/ruby TARGET=crails bin/run

png:
  max_diff_ratio: 0.002

# Сравнение исходников: rake code:oracle / code:current копируют файлы дерева
# (вне .gitignore) в общий формат <имя>.code.txt — построчный diff кода
# crails против Rails-оригинала (доля совпавших файлов по стилю).
# env -u …: twinshot активируется через bundler корневого Gemfile и прокидывает
# RUBYOPT/BUNDLE_* в дочерний rake, где его нет в бандле (как harness_env).
groups:
  code:
    oracle:
      path: code-artifacts/oracle
      generate: env -u RUBYOPT -u BUNDLE_GEMFILE -u BUNDLE_BIN_PATH -u BUNDLER_SETUP rake code:oracle
    current:
      path: code-artifacts/current
      generate: env -u RUBYOPT -u BUNDLE_GEMFILE -u BUNDLE_BIN_PATH -u BUNDLER_SETUP rake code:current

soft_check:
  - messaging/test_custom_boost_with_text/custom-boost.png
  - sidebar/test_narrow_viewport_renders_the_mobile_layout/mobile.png

  # Путь в soft_check — относительный путь внутри дерева группы (без префикса
  # имени группы): артефакты лежат в code-artifacts/<side>/capybara-tests/...,
  # поэтому пишем "capybara-tests/*", а не "code/capybara-tests/*".
  - capybara-tests/*
  - docs/*
  - test/*
  - vendor/*
  - taks/*
  - db/migrate/*

