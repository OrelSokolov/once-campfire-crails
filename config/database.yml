# Picked up automatically at boot (DATABASE_URL overrides).
# The benchmark copies the canonical seed database here (bench harness
# mounts fixture db/production.sqlite3); local dev points at db/.
development:
  adapter: sqlite3
  database: db/development.sqlite3
test:
  adapter: sqlite3
  database: db/test.sqlite3
production:
  adapter: sqlite3
  database: db/production.sqlite3
